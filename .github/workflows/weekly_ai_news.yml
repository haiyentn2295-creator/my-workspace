name: Weekly Telegram AI News Bot

# Lên lịch chạy tự động & cho phép chạy thủ công
on:
  schedule:
    # 10:00 AM giờ Việt Nam (UTC+7) = 03:00 AM giờ UTC quốc tế
    # Cú pháp cron: Phút (0) Giờ (3) NgàyTrongTháng (*) Tháng (*) ThứTrongTuần (1 = Thứ Hai)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Nút bấm chạy thủ công trên giao diện GitHub Actions

jobs:
  run-ai-news-bot:
    name: Run Telegram AI News Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Thiết lập môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Chạy bot tổng hợp & gửi tin AI lên Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RSS_KEYWORDS: "AI OR OpenAI OR Google AI"
          GEMINI_MODEL: "gemini-2.5-flash"
        run: |
          python send_telegram.py
